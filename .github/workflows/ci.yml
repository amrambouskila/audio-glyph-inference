name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1 libgl1 libglib2.0-0 ffmpeg
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install project
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv
          uv pip install -e '.[dev]'
      - name: Ruff check + format
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run ruff check .
          uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    # Postgres for the Stage-3+ real-DB integration tests (no DB mocking — see CLAUDE.md §13).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: audio_glyph_inference
          POSTGRES_USER: agi_dev
          POSTGRES_PASSWORD: agi_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agi_dev -d audio_glyph_inference"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1 libgl1 libglib2.0-0 ffmpeg
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install project
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv
          uv pip install -e '.[dev]'
      - name: Test with 100% coverage gate
        env:
          BACKEND_DATABASE_URL: postgresql+asyncpg://agi_dev:agi_dev_password@localhost:5432/audio_glyph_inference
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=100 --junitxml=junit.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1 libgl1 libglib2.0-0 ffmpeg
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Build
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: backend/dist/

  frontend:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm run test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser-smoke frontend
        run: npm run test:browser
      - name: Build frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [build, frontend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
