name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1 libgl1 libglib2.0-0 ffmpeg
      # Pinned action instead of `curl | sh`: a compromised or hijacked install script would
      # otherwise execute arbitrary code in the runner. Matches release.yml and the rest of the fleet.
      - uses: astral-sh/setup-uv@v3
      - name: Install project
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv
          uv pip install -e '.[dev]'
      - name: Ruff check + format
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run ruff check .
          uv run ruff format --check .

  sast:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1 libgl1 libglib2.0-0 ffmpeg
      # Pinned action instead of `curl | sh`: a compromised or hijacked install script would
      # otherwise execute arbitrary code in the runner. Matches release.yml and the rest of the fleet.
      - uses: astral-sh/setup-uv@v3
      - name: Install project
        working-directory: backend
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv
          uv pip install -e '.[dev]' pip-audit
      - uses: github/codeql-action/init@v3
        with:
          languages: python,javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql
      - name: Semgrep
        run: |
          pipx run semgrep scan --config auto --config p/owasp-top-ten --config p/python --config p/typescript --config p/react --config p/docker --severity ERROR --error --sarif --output semgrep.sarif || echo "SEMGREP_FAILED=1" >> "$GITHUB_ENV"
      - uses: github/codeql-action/upload-sarif@v3
        if: ${{ !cancelled() }}
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Fail on Semgrep findings
        run: test -z "${SEMGREP_FAILED:-}"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend dependency audit
        working-directory: backend
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run pip-audit

  test:
    runs-on: ubuntu-latest
    needs: sast
    permissions:
      contents: read
      checks: write
      pull-requests: write
    # Postgres for the Stage-3+ real-DB integration tests (no DB mocking — see CLAUDE.md §13).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: audio_glyph_inference
          POSTGRES_USER: agi_dev
          POSTGRES_PASSWORD: agi_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agi_dev -d audio_glyph_inference"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1 libgl1 libglib2.0-0 ffmpeg
      # Pinned action instead of `curl | sh`: a compromised or hijacked install script would
      # otherwise execute arbitrary code in the runner. Matches release.yml and the rest of the fleet.
      - uses: astral-sh/setup-uv@v3
      - name: Install project
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv
          uv pip install -e '.[dev]'
      - name: Test with 100% coverage gate
        env:
          BACKEND_DATABASE_URL: postgresql+asyncpg://agi_dev:agi_dev_password@localhost:5432/audio_glyph_inference
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=100 --junitxml=junit-backend.xml
      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: ${{ !cancelled() }}
        with:
          name: backend tests
          path: backend/junit-backend.xml
          reporter: java-junit

  build:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1 libgl1 libglib2.0-0 ffmpeg
      # Pinned action instead of `curl | sh`: a compromised or hijacked install script would
      # otherwise execute arbitrary code in the runner. Matches release.yml and the rest of the fleet.
      - uses: astral-sh/setup-uv@v3
      - name: Build
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: backend/dist/

  frontend:
    runs-on: ubuntu-latest
    needs: sast
    permissions:
      contents: read
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm run test -- --reporter=default --reporter=junit --outputFile.junit=junit-frontend.xml
      - name: Publish frontend test report
        uses: dorny/test-reporter@v1
        if: ${{ !cancelled() }}
        with:
          name: frontend tests
          path: frontend/junit-frontend.xml
          reporter: java-junit
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser-smoke frontend
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: junit-e2e.xml
        run: npm run test:browser -- --reporter=line,junit
      - name: Publish e2e test report
        uses: dorny/test-reporter@v1
        if: ${{ !cancelled() }}
        with:
          name: e2e tests
          path: frontend/junit-e2e.xml
          reporter: java-junit
      - name: Build frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [build, frontend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: audio-glyph-inference-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          tags: audio-glyph-inference-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: audio-glyph-inference-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: audio-glyph-inference-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
